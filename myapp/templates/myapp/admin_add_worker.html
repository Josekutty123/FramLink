{% extends 'myapp/admin_base.html' %}
{% block title %}Add Worker - Admin{% endblock %}
{% block admin_content %}
<div class="container-fluid p-4">
    <h2 class="mb-4">Add New Worker</h2>
    <div class="card shadow-sm" style="max-width: 600px;">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary mt-3">Create Worker</button>
                <a href="{% url 'admin_workers' %}" class="btn btn-secondary mt-3">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
