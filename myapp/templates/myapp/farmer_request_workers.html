{% extends 'myapp/erp_base.html' %}
{% block title %}Request Workers{% endblock %}
{% block erp_content %}
<div class="container-fluid px-4 py-5">
    <h2 class="mb-4">Request Workers</h2>
    <div class="card shadow-sm border-0 rounded-4" style="max-width: 600px;">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success mt-3">Submit Request</button>
                <a href="{% url 'farmer_worker_requests' %}" class="btn btn-secondary mt-3">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
