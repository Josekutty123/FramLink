{% extends 'myapp/admin_base.html' %}
{% load static %}

{% block admin_content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold text-success mb-1">{{ title }}</h3>
            <p class="text-muted mb-0">Fill in the details below</p>
        </div>
        <a href="{% url 'admin_deliveries' %}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Back to List
        </a>
    </div>

    <div class="row">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">
                    <form method="post" novalidate>
                        {% csrf_token %}
                        
                        <div class="row g-3">
                            {% for field in form %}
                                <div class="col-md-6">
                                    <label for="{{ field.id_for_label }}" class="form-label fw-semibold">{{ field.label }}</label>
                                    {{ field }}
                                    {% if field.errors %}
                                        <div class="text-danger small mt-1">
                                            {{ field.errors.0 }}
                                        </div>
                                    {% endif %}
                                </div>
                            {% endfor %}
                        </div>

                        <div class="mt-4 pt-3 border-top">
                            <button type="submit" class="btn btn-success px-5 py-2 fw-bold">
                                <i class="bi bi-save me-2"></i> Save Delivery Person
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
